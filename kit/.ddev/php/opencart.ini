; Настройки PHP для OpenCart (подхватываются DDEV автоматически, после изменения — ddev restart)
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
upload_max_filesize = 128M
post_max_size = 128M
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
